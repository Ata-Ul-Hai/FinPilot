[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "close-copilot"
version = "0.1.0"
description = "Deterministic, evidence-first month-end close engine"
requires-python = ">=3.11"
dependencies = [
  "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]
